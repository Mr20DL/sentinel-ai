services:
  - type: web
    name: sentinel-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SENTINEL_LLM_PROVIDER
        value: groq
      - key: SENTINEL_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: SENTINEL_LLM_STRUCTURED_METHOD
        value: function_calling
      - key: SENTINEL_LLM_TIMEOUT
        value: "30"
      - key: SENTINEL_LLM_MAX_RETRIES
        value: "3"
      - key: GROQ_API_KEY
        sync: false
      - key: SENTINEL_EMBEDDING_PROVIDER
        value: gemini
      - key: SENTINEL_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: SENTINEL_EMBEDDING_DIMENSIONS
        value: "384"
      - key: SENTINEL_EMBEDDING_TIMEOUT
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTINEL_INGEST_API_KEY
        sync: false
      - key: SENTINEL_OTEL_MAX_EVENTS
        value: "3"
      - key: SENTINEL_OTEL_DEDUP_TTL
        value: "60"
      - key: SENTINEL_DASHBOARD_MAX_EVENTS
        value: "100"
      - key: SENTINEL_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: SENTINEL_QUEUE_PROVIDER
        value: inline
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_URL
        value: https://qstash-us-east-1.upstash.io
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: SENTINEL_OTEL_WORKER_URL
        sync: false
      - key: SENTINEL_OBSERVABILITY_PROVIDER
        value: noop
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      - key: LANGFUSE_TRACING_ENVIRONMENT
        value: production
