[project]
name = "sentinel-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "typing-extensions>=4.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]