[project]
name = "sentinel-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "typing-extensions>=4.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain-openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.coverage.run]
branch = true
source = ["src"]
